services:
  mysql:
    image: mysql:8.4
    container_name: pantry-lens-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: pantry_lens
      MYSQL_USER: pantry
      MYSQL_PASSWORD: pantry
    volumes:
      - pantry_lens_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pantry_lens_mysql_data:
